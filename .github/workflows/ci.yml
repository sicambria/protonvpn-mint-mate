name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          python3-gi python3-gi-cairo \
          gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
          gir1.2-notify-0.7 zenity xdotool xvfb \
          git

    - name: Install Python test tools
      run: |
        pip install --break-system-packages coverage

    - name: Python tests with coverage
      run: |
        cd ${{ github.workspace }}
        PYTHONPATH=. python3 -m coverage run --branch --source=. tests/run_all.py
        python3 -m coverage report -m --fail-under=100

    - name: Shell script tests
      run: |
        cd ${{ github.workspace }}
        python3 tests/test_shell_scripts.py

    - name: GTK integration tests (Xvfb)
      run: |
        cd ${{ github.workspace }}
        xvfb-run python3 tests/test_gtk_integration.py

    - name: Generate HTML coverage report
      if: always()
      run: |
        cd ${{ github.workspace }}
        python3 -m coverage html

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
